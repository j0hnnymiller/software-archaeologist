<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Software Archaeologist repository layout</title>
  <desc id="desc">A host repository containing GitHub Copilot instructions, skills, and agents, with a target codebase mounted as a Git submodule pinned to a single commit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a36"/>
      <stop offset="1" stop-color="#3b2f22"/>
    </linearGradient>
    <pattern id="strata" width="1200" height="40" patternUnits="userSpaceOnUse">
      <rect width="1200" height="20" fill="#5a4630"/>
      <rect y="20" width="1200" height="20" fill="#4b3a28"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect y="430" width="1200" height="170" fill="url(#strata)" opacity="0.9"/>

  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f4e9d8">Software Archaeologist</text>
  <text x="600" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cdbfa8">The tools live in the host repository. The dig site is a submodule.</text>

  <rect x="80" y="150" width="1040" height="420" rx="18" fill="none" stroke="#f4e9d8" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="104" y="184" font-family="Consolas, Menlo, monospace" font-size="20" fill="#f4e9d8">software-archaeologist/  (host repository)</text>

  <g font-family="Consolas, Menlo, monospace" font-size="18">
    <rect x="120" y="210" width="430" height="190" rx="12" fill="#2d6a8f"/>
    <text x="140" y="245" fill="#ffffff" font-weight="700">.github/</text>
    <text x="160" y="280" fill="#e6f2fa">agents/      custom agents</text>
    <text x="160" y="312" fill="#e6f2fa">skills/      agent skills</text>
    <text x="160" y="344" fill="#e6f2fa">instructions/ *.instructions.md</text>
    <text x="160" y="376" fill="#e6f2fa">copilot-instructions.md</text>

    <rect x="650" y="210" width="430" height="190" rx="12" fill="#8f5a2d"/>
    <text x="670" y="245" fill="#ffffff" font-weight="700">target/  (git submodule)</text>
    <text x="690" y="280" fill="#fbeee0">.git  -&gt; gitdir pointer</text>
    <text x="690" y="312" fill="#fbeee0">pinned commit (mode 160000)</text>
    <text x="690" y="344" fill="#fbeee0">its own .github/ config</text>
    <text x="690" y="376" fill="#fbeee0">codebase under analysis</text>
  </g>

  <g stroke="#f4e9d8" stroke-width="4" fill="#f4e9d8">
    <line x1="555" y1="305" x2="636" y2="305"/>
    <polygon points="645,305 630,296 630,314"/>
  </g>
  <text x="600" y="290" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#f4e9d8">analyze</text>

  <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#f4e9d8">
    <text x="120" y="470">.gitmodules</text>
    <text x="120" y="504">.github/scripts/replace-target.ps1  swap the dig site safely</text>
    <text x="120" y="538">docs/  ai-logs/  README.md</text>
  </g>
</svg>
